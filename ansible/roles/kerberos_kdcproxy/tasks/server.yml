---
# KpsSvc (KDC Proxy Server service) を立てる。Windows Server に同梱のサービスなので導入は不要で、
# 必要なのは「証明書を 443 にバインドする」「設定値を入れる」「起動する」の 3 点。
#
# ハマりどころ: LibNames (REG_MULTI_SZ で kerberos.dll) が無いと、サービスは起動していても
# Kerberos を処理せず、クライアントは無言で NTLM に落ちる。設定漏れの典型。
- name: "KDC プロキシ用の自己署名証明書を用意して 443 へバインド"
  ansible.windows.win_powershell:
    parameters:
      ProxyFqdn: "{{ kdcproxy_fqdn }}"
      Port: "{{ kdcproxy_port | int }}"
      AppId: "{{ kdcproxy_app_id }}"
    script: |
      param([string]$ProxyFqdn, [int]$Port, [string]$AppId)
      $ErrorActionPreference = 'Stop'
      $changed = $false

      $cert = Get-ChildItem Cert:\LocalMachine\My |
              Where-Object { $_.Subject -eq "CN=$ProxyFqdn" -and $_.NotAfter -gt (Get-Date) } |
              Sort-Object NotAfter -Descending | Select-Object -First 1
      if (-not $cert) {
          $cert = New-SelfSignedCertificate -DnsName $ProxyFqdn -CertStoreLocation Cert:\LocalMachine\My `
                  -FriendlyName 'hyperv-nestlab KDC Proxy' -NotAfter (Get-Date).AddYears(2)
          $changed = $true
      }

      # 既存バインドが別の拇印なら張り替える (冪等)。
      $binding = netsh http show sslcert ipport=0.0.0.0:$Port 2>$null | Out-String
      if ($binding -notmatch [regex]::Escape($cert.Thumbprint)) {
          if ($binding -match 'IP:port') { netsh http delete sslcert ipport=0.0.0.0:$Port | Out-Null }
          netsh http add sslcert ipport=0.0.0.0:$Port certhash=$($cert.Thumbprint) appid="{$AppId}" certstorename=MY | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "netsh add sslcert が失敗しました (exit $LASTEXITCODE)" }
          $changed = $true
      }

      $Ansible.Changed = $changed
      $Ansible.Result = @{ thumbprint = $cert.Thumbprint; subject = $cert.Subject }
  register: kdcproxy_cert

- name: "https://+:443/KdcProxy の URL 予約を NETWORK SERVICE に与える"
  # KPSSVC は svchost -k KpsSvcGroup の NETWORK SERVICE で動く。RD ゲートウェイ役割を入れずに
  # 単体で立てると HTTP.SYS の URL 予約が無く、証明書を 443 にバインドしてあっても
  # サービスは「アクセスが拒否されました」(システムログ 7023) で即停止する。
  # netsh の出力は言語依存なので、既存判定は show urlacl のマッチで行う。
  ansible.windows.win_powershell:
    parameters:
      Port: "{{ kdcproxy_port | int }}"
    script: |
      param([int]$Port)
      $ErrorActionPreference = 'Stop'
      # HTTP.SYS は予約を末尾スラッシュ付きで保持する。スラッシュ無しで show すると
      # 既存でも何も返らないため、存在判定は一覧を引いて文字列一致で行う。
      $url = "https://+:$Port/KdcProxy/"
      $all = (netsh http show urlacl | Out-String)
      if ($all -match [regex]::Escape($url)) {
          $Ansible.Changed = $false
      } else {
          # ローカライズ環境でも確実に解決するため SID から名前を引く (S-1-5-20 = NETWORK SERVICE)。
          $acct = (New-Object System.Security.Principal.SecurityIdentifier('S-1-5-20')).Translate([System.Security.Principal.NTAccount]).Value
          $out = (netsh http add urlacl url=$url user="$acct" | Out-String)
          # 競合で先に作られていた場合は成功とみなす (再実行で落とさない)。
          $after = (netsh http show urlacl | Out-String)
          if ($after -notmatch [regex]::Escape($url)) {
              throw "netsh add urlacl が失敗しました (exit $LASTEXITCODE): $out"
          }
          $Ansible.Changed = $true
      }
      $Ansible.Result = $url
  register: kps_urlacl

- name: "証明書の秘密鍵を NETWORK SERVICE が読めるようにする"
  # New-SelfSignedCertificate は SYSTEM / Administrators にしか鍵の ACL を与えない。
  ansible.windows.win_powershell:
    parameters:
      Thumbprint: "{{ kdcproxy_cert.result.thumbprint }}"
    script: |
      param([string]$Thumbprint)
      $ErrorActionPreference = 'Stop'
      $cert = Get-Item "Cert:\LocalMachine\My\$Thumbprint"
      $name = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($cert).Key.UniqueName
      $path = Join-Path $env:ProgramData "Microsoft\Crypto\Keys\$name"
      if (-not (Test-Path $path)) { throw "秘密鍵ファイルが見つかりません: $path" }
      $acct = (New-Object System.Security.Principal.SecurityIdentifier('S-1-5-20')).Translate([System.Security.Principal.NTAccount]).Value
      $acl = Get-Acl $path
      if ($acl.Access | Where-Object { $_.IdentityReference.Value -eq $acct -and $_.FileSystemRights -match 'Read' }) {
          $Ansible.Changed = $false
      } else {
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule($acct, 'Read', 'Allow')))
          Set-Acl $path $acl
          $Ansible.Changed = $true
      }
      $Ansible.Result = $path

- name: "KpsSvc の設定 (HttpsClientAuth)"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\KPSSVC\Settings
    name: HttpsClientAuth
    data: 0
    type: dword
  register: kps_auth

- name: "KpsSvc の設定 (LibNames) ─ これが無いと Kerberos を処理せず無言で NTLM に落ちる"
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\KPSSVC\Settings
    name: LibNames
    data: ['kerberos.dll']
    type: multistring
  register: kps_lib

- name: "KDC プロキシの受信を許可 (TCP {{ kdcproxy_port }})"
  community.windows.win_firewall_rule:
    name: "hyperv-nestlab KDC Proxy (TCP {{ kdcproxy_port }})"
    localport: "{{ kdcproxy_port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true

- name: "KpsSvc を自動起動で開始"
  ansible.windows.win_service:
    name: KPSSVC
    start_mode: auto
    state: started

- name: "設定変更があったら KpsSvc を再起動して反映"
  when: (kps_auth is changed) or (kps_lib is changed) or (kdcproxy_cert is changed)
  ansible.windows.win_service:
    name: KPSSVC
    state: restarted

- name: "クライアントへ配る公開証明書を取り出す"
  ansible.windows.win_powershell:
    parameters:
      Thumbprint: "{{ kdcproxy_cert.result.thumbprint }}"
    script: |
      param([string]$Thumbprint)
      $ErrorActionPreference = 'Stop'
      $path = 'C:\Windows\Temp\kdcproxy.cer'
      $cert = Get-Item "Cert:\LocalMachine\My\$Thumbprint"
      Export-Certificate -Cert $cert -FilePath $path -Force | Out-Null
      $Ansible.Changed = $false
      $Ansible.Result = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
  register: kdcproxy_cert_export

- name: "公開証明書を制御 VM へ退避 (クライアントへ配るため)"
  delegate_to: localhost
  ansible.builtin.copy:
    content: "{{ kdcproxy_cert_export.result }}"
    dest: "{{ kdcproxy_cert_fetch_dir }}/kdcproxy.cer.b64"
    mode: "0600"

- name: "KpsSvc の待ち受けを確認 (443 が LISTEN していなければ失敗させる)"
  ansible.windows.win_powershell:
    parameters:
      Port: "{{ kdcproxy_port | int }}"
    script: |
      param([int]$Port)
      $ErrorActionPreference = 'Stop'
      $svc = Get-Service KPSSVC
      $listening = @(Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue).Count -gt 0
      if ($svc.Status -ne 'Running') { throw "KPSSVC が起動していません: $($svc.Status)" }
      if (-not $listening) { throw "TCP $Port が LISTEN していません (証明書バインドを確認)" }
      $Ansible.Changed = $false
      $Ansible.Result = "KPSSVC Running / TCP $Port listening"
