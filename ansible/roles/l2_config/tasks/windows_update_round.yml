---
# One round of Windows Update. Some updates only appear after the previous ones and a reboot.
- name: "Windows Update を適用 (ラウンド {{ update_round }})"
  when: not (l2_updates_finished | default(false))
  ansible.windows.win_updates:
    category_names: [SecurityUpdates, CriticalUpdates, UpdateRollups, Updates]
    reject_list: ['(?i)preview']
    reboot: false
  register: l2_updates

- name: "更新で再起動が必要なら再起動 (ラウンド {{ update_round }})"
  when:
    - not (l2_updates_finished | default(false))
    - l2_updates.reboot_required | default(false)
  ansible.windows.win_reboot:
    reboot_timeout: 3600

- name: "適用した更新の件数 (ラウンド {{ update_round }})"
  when: not (l2_updates_finished | default(false))
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: installed={{ l2_updates.installed_update_count | default(0) }} failed={{ l2_updates.failed_update_count | default(0) }}"

- name: "適用できなかった更新があれば失敗 (ラウンド {{ update_round }})"
  when:
    - not (l2_updates_finished | default(false))
    - (l2_updates.failed_update_count | default(0)) > 0
  ansible.builtin.fail:
    msg: "{{ inventory_hostname }}: {{ l2_updates.failed_update_count }} update(s) failed"

- name: "残りの更新が無ければ終了 (ラウンド {{ update_round }})"
  when:
    - not (l2_updates_finished | default(false))
    - (l2_updates.found_update_count | default(0)) == 0
  ansible.builtin.set_fact:
    l2_updates_finished: true
